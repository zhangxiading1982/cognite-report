name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SLIDEBI_ADMIN_URL: postgresql://postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://slidebi_app@localhost:5432/slidebi
      SLIDEBI_TEST_DATABASE_URL: postgresql://slidebi_app@localhost:5432/slidebi_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:init -- --with-test
      - run: npm run db:seed
      - run: npm run docs:check
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=critical
